<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Chaos Villa</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <!-- HUD Overlay -->
    <div id="hud">
      <aside id="minimap-panel" aria-label="City minimap">
        <canvas id="city-minimap" width="240" height="240"></canvas>
      </aside>

      <div id="center-notifications">
        <div id="status-banner" class="hidden"></div>
        <div id="interaction-prompt" class="hidden">[E] Interact</div>
      </div>

      <div id="bar-music-controls" class="hidden">
        Bar Music: N Next Track · P Previous Track · D Dance
      </div>

    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
